<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>About Hello World</title>
  <style>
    :root { color-scheme: dark; }

      margin: 0;

<body>

    document.getElementById('home').addEventListener('click', function (event) {
      event.preventDefault();
      MBM.navigate('/plugins/hello-world');
    });
